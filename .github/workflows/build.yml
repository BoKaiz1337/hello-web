name: 构建并推送镜像

# 第八课的「提交即上线」：tag 才是发布按钮，推 main 不发版
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: registry.dev.oaiai.ai/zbk/hello-web

jobs:
  build:
    # GitHub 的托管 runner，天生 linux/amd64 —— 不用再写 --platform
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v4

      # 口令存在仓库 Secret 里，不在任何文件中；日志自动打码
      - name: 登录镜像仓库
        uses: docker/login-action@v4
        with:
          registry: registry.dev.oaiai.ai
          username: student
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # 课件第 2 步「从 tag 里取出版本号」的 CI 写法：
      # 只取一次，后面全部引用 metadata 的输出，不重复写版本号
      - name: 计算镜像标签
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=sha,format=short

      - name: 构建并推送
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 课件第 3 步的镜像元数据，由 metadata-action 自动打上
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 把标签写进构建摘要
        run: |
          {
            echo "## 镜像已推送"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
