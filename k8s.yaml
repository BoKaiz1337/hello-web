# 第八课作业：hello-web 部署到 st-zbk
# 应用: kubectl apply -f k8s.yaml
#
# 域名说明：课件写 <用户名>.dev.oaiai.ai，但 zbk.dev.oaiai.ai 已被 sub2api 占用，
# zbk-hello.dev.oaiai.ai 被第六课的 Flask hello 占用 —— 所以另开一个子域。
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-web
  namespace: st-zbk
  labels: {app: hello-web}
spec:
  replicas: 1
  selector:
    matchLabels: {app: hello-web}
  template:
    metadata:
      labels: {app: hello-web}
    spec:
      # 教学仓库是私有的，集群自己拉不动 —— 得给它钥匙（第七课建的 regcred）
      imagePullSecrets:
        - name: regcred
      containers:
        # ★ 容器名必须是 web：课件里那条换版本的命令是
        #   kubectl set image deployment/hello-web web=...:v2
        - name: web
          image: registry.dev.oaiai.ai/zbk/hello-web:v1
          ports:
            - containerPort: 80
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: hello-web
  namespace: st-zbk
spec:
  selector: {app: hello-web}
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-web
  namespace: st-zbk
  annotations:
    # 这两条照抄第六课已验证可用的 hello ingress
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    # 准入策略 bastion-student-ingress-hosts 要求单段 + .dev.oaiai.ai，这个合规
    - host: zbk-web.dev.oaiai.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello-web
                port: {number: 80}
  tls:
    - hosts: [zbk-web.dev.oaiai.ai]
      secretName: hello-web-tls
